<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="自動投票">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=3">
<title>競馬自動投票</title>
</head>
<body>
<div id="login" class="screen" hidden>
  <form id="login-form" class="card login">
    <h1>競馬自動投票</h1>
    <label>パスワード<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">ログイン</button>
    <p id="login-err" class="err"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="bar">
    <input id="date" type="date" aria-label="開催日">
    <span id="mode-chip" class="chip"></span>
  </header>

  <main>
    <section id="tab-today" class="tab">
      <div id="day-card" class="card"></div>

      <div class="card">
        <h2>予想を送る</h2>
        <textarea id="text" rows="8" placeholder="新潟&#10;1R ★ 3.7.10&#10;2R ◎ 4 ★ 5.7.9&#10;&#10;東京&#10;11R ◎ 2 ★ 3.6.9.12"></textarea>
        <div class="row">
          <button id="btn-parse" class="primary">読み取り</button>
          <button id="btn-clear" class="ghost">クリア</button>
        </div>
        <div id="parse-out"></div>
      </div>

      <div class="card">
        <h2>予約・投票の状況</h2>
        <div id="orders"></div>
      </div>
    </section>

    <section id="tab-sim" class="tab" hidden>
      <div class="card">
        <h2>仮想収支を計算</h2>
        <p class="muted">やらなかった日の予想を貼ると、レース結果を取り込んで、ルール通りに賭けた場合の収支を計算します。</p>
        <input id="sim-date" type="date" aria-label="計算する日">
        <textarea id="sim-text" rows="8" placeholder="その日の予想を貼り付け"></textarea>
        <button id="btn-sim" class="primary">計算する</button>
        <p id="sim-err" class="err"></p>
      </div>
      <div id="sim-total" class="card" hidden></div>
      <div id="sims"></div>
    </section>

    <section id="tab-settings" class="tab" hidden>
      <form id="settings" class="card">
        <h2>投票モード</h2>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="mode" value="off"><span>練習</span></label>
          <label><input type="radio" name="mode" value="rehearsal"><span>リハーサル</span></label>
          <label><input type="radio" name="mode" value="live"><span>本番</span></label>
        </div>
        <p class="muted" id="mode-help"></p>
        <label class="switch"><input type="checkbox" name="paused"><span>一時停止（投票しない）</span></label>

        <h2>平日（複勝の転がし）</h2>
        <label>資金（円）<input name="weekday_limit" type="number" step="100" min="0"></label>
        <label>1回目の金額（円）<input name="roll_stake" type="number" step="100" min="100"></label>
        <label>何回連続で的中したら終了<input name="roll_target" type="number" min="1" max="20"></label>

        <h2>土日祝</h2>
        <label>1日の上限（円）<input name="holiday_limit" type="number" step="100" min="0"></label>
        <label>単勝の最初の金額・増やす額（円）<input name="tansho_base" type="number" step="100" min="100"></label>
        <label>この倍率以下の単勝は見送り<input name="tansho_min_odds" type="number" step="0.1" min="1"></label>
        <label>ワイド1点（円）<input name="wide_amount" type="number" step="100" min="100"></label>
        <label>複勝1点（円）<input name="fukusho_amount" type="number" step="100" min="100"></label>
        <label>前の単勝の結果が未確定のとき
          <select name="pending_policy">
            <option value="assume_loss">外れとみなして増額して買う</option>
            <option value="skip">単勝を見送る</option>
          </select>
        </label>
        <label>オッズを読み取れなかったとき
          <select name="odds_unknown">
            <option value="skip">単勝を見送る</option>
            <option value="buy">買う</option>
          </select>
        </label>

        <h2>タイミング</h2>
        <label>発走の何分前に投票<input name="vote_offset_min" type="number" min="3" max="60"></label>
        <label>発走の何分後に結果を確認<input name="result_delay_min" type="number" min="3" max="60"></label>

        <button class="primary" type="submit">保存</button>
        <p id="settings-msg" class="muted"></p>
      </form>
      <div class="card">
        <h2>接続テスト</h2>
        <p class="muted">投票サイトにログインして、購入の直前まで試します。<b>購入はしません。</b>×が出たら、この画面のスクショを送ってください。</p>
        <label>投票サイト
          <select id="chk-site"><option value="ipat">即PAT（中央）</option><option value="spat4">SPAT4（地方）</option></select>
        </label>
        <div class="row">
          <label style="flex:1">開催場<select id="chk-venue"></select></label>
          <label style="width:80px">レース<input id="chk-race" type="number" min="1" max="12" value="11"></label>
          <label style="width:80px">馬番<input id="chk-horse" type="number" min="1" max="18" value="1"></label>
        </div>
        <p class="muted">その日に発売中のレースを選んでください。</p>
        <button id="btn-check" class="primary">テストする</button>
        <div id="chk-out"></div>
      </div>
      <div class="card">
        <h2>ログ</h2>
        <div id="logs" class="logs"></div>
      </div>
    </section>
  </main>

  <nav class="tabs">
    <button data-tab="today" class="on">今日</button>
    <button data-tab="sim">仮想収支</button>
    <button data-tab="settings">設定</button>
  </nav>
</div>

<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<div id="toast" role="status"></div>
<script src="app.js?v=3"></script>
</body>
</html>
